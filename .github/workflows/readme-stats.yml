# Save as .github/workflows/readme-stats.yml in the shams-imran/shams-imran repo.
# Builds the GitHub stats, top-languages and streak cards inside the repo, so the
# profile no longer depends on the public stats servers.
name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:        # run it manually from the Actions tab
  push:                     # re-generate right away when the card options change
    branches: [master]
    paths: [".github/workflows/readme-stats.yml"]

# Never let two card updates race each other (e.g. cron + manual run).
concurrency:
  group: readme-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Check out the branch tip, not the commit that triggered the run. Re-runs
      # reuse the original commit, which may be behind by then.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=transparent&count_private=true&include_all_commits=true&show=prs_merged_percentage,prs_reviewed
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&theme=transparent&disable_animations=true&timezone=Asia/Dhaka
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # The freshly generated cards are always the newest data, so replay them on
      # top of the latest remote branch and retry if someone pushed in between.
      - name: Commit cards
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cards="$RUNNER_TEMP/cards"
          mkdir -p "$cards"
          cp profile/*.svg "$cards/"

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp "$cards"/*.svg profile/
            git add profile/*.svg

            if git diff --cached --quiet; then
              echo "Cards are unchanged; nothing to commit."
              exit 0
            fi

            git commit -m "Update README stats cards"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi

            echo "Push rejected (attempt $attempt/3); retrying on the latest $BRANCH..."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push updated cards to $BRANCH after 3 attempts."
          exit 1
